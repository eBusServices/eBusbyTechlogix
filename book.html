<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Page - TechLogix</title>
    <link rel="icon" href="images/logo.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="bg-blue-200 p-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="images/logo.jpg" alt="Logo" class="h-8 w-8 rounded-full" />
        <span class="text-xl font-bold">Booking Page</span>
      </div>
      <ul class="flex gap-4 p-4">
        <li><a href="index.html" class="hover:underline">Home Page</a></li>
        <li><a href="branches.html" class="hover:underline">Branches</a></li>
        <li><a href="#" class="hover:underline">Turns</a></li>
        <li><a href="book.html" class="hover:underline">Book Trip</a></li>
        <li><a href="#" class="hover:underline">Find Ticket</a></li>
      </ul>
    </nav>

    <!-- Main -->
    <main class="max-w-6xl mx-auto p-6 space-y-8">
      <!-- Booking Form -->
      <section class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4">Book a Trip</h2>
        <form class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <select class="p-2 border rounded" required>
            <option>Select Route</option>
            <option>Makurdi - Abuja</option>
            <option>Abuja - Makurdi</option>
            <option>Charter - Makurdi to Abuja</option>
            <option>Charter - Abuja to Makurdi</option>
          </select>
          <input type="text" minlength="2" class="p-2 border rounded" placeholder="Name of Passenger" required />
          <input type="number" min="1" class="p-2 border rounded" placeholder="Number of Seats" required />
          <input type="tel" minlength="10" maxlength="11" class="p-2 border rounded" placeholder="Phone Number" required />
          <input type="email" class="p-2 border rounded" placeholder="Email Address" required />
          <input type="text" class="p-2 border rounded" placeholder="Name of Next of Kin" required />
          <input type="tel" minlength="10" maxlength="11" class="p-2 border rounded" placeholder="Next of Kin's Phone Number" required />
          <input type="date" class="p-2 border rounded" required />
          <input type="time" class="p-2 border rounded" required />
          <select class="p-2 border rounded" required>
            <option>Select Blood Group</option>
            <option>A</option>
            <option>B</option>
            <option>AB</option>
            <option>O</option>
          </select>
          <button class="col-span-1 sm:col-span-3 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded">
            Book Trip
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
