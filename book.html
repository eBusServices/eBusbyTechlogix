<!DOCTYPE html>
<!-- booking page -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Trips - TechLogix</title>
  <link rel="icon" href="images/logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Navbar -->
  <nav class="bg-blue-200 p-4 flex justify-between items-center text-black-600">
    <div class="flex items-center gap-2">
      <img src="images/logo.jpg" alt="Logo" class="h-8 w-8 rounded-full">
      <span class="text-xl font-bold">TechLogix</span>
    </div>
    <ul class="flex gap-4">
      <li><a href="index.html" class="hover:underline">Home Page</a></li>
      <li><a href="#" class="hover:underline">Branches</a></li>
      <li><a href="#" class="hover:underline">Turns</a></li>
      <li><a href="book.html" class="hover:underline">View Trips</a></li>
      <li><a href="#" class="hover:underline">Find Ticket</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Available Trips</h1>
    <div id="tripTable" class="space-y-4"></div>
  </main>

  <!-- Trip Data Script -->
  <script>
    const trips = [
      { id: "1", route: "B to A", price: 1000 },
      { id: "2", route: "A to B", price: 1200 }
    ];

    const tripTable = document.getElementById('tripTable');

    trips.forEach(trip => {
      const card = document.createElement('div');
      card.className = 'bg-white p-4 rounded shadow';

      card.innerHTML = `
        <h2 class="text-xl font-semibold mb-2">Route: ${trip.route}</h2>
        <p class="text-gray-700">Price: ₦${trip.price.toLocaleString()}</p>
        <p class="text-sm text-gray-500">Trip ID: ${trip.id}</p>
      `;

      tripTable.appendChild(card);
    });
  </script>

  <!-- Optional external JS -->
  <script src="scripts/main.js"></script>

</body>
</html>
