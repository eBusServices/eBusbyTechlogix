<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Dashboard - TechLogix</title>
  <link rel="icon" href="images/logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Navbar -->
  <nav class="bg-blue-200 p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <img src="images/logo.jpg" alt="Logo" class="h-8 w-8 rounded-full">
      <span class="text-xl font-bold">Driver Dashboard</span>
    </div>
    <a href="driver-login.html" class="bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600">Logout</a>
  </nav>

  <!-- Main -->
  <main class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">My Scheduled Trips</h1>

    <table class="w-full bg-white shadow rounded-lg overflow-hidden">
      <thead class="bg-blue-100">
        <tr>
          <th class="p-3 text-left">Date</th>
          <th class="p-3 text-left">Time</th>
          <th class="p-3 text-left">Route</th>
          <th class="p-3 text-left">Vehicle</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b">
          <td class="p-3">2025-08-16</td>
          <td class="p-3">08:00 AM</td>
          <td class="p-3">Makurdi - Abuja</td>
          <td class="p-3">Bus #12</td>
        </tr>
        <tr>
          <td class="p-3">2025-08-17</td>
          <td class="p-3">02:00 PM</td>
          <td class="p-3">Abuja - Makurdi</td>
          <td class="p-3">Bus #7</td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
